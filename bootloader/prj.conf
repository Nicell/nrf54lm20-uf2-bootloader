CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
# Big SCSI buffers so a high-speed host can stream multi-sector WRITE(10)s;
# with double buffering USB fills one while the other is written to RRAM.
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=16384
CONFIG_USBD_MSC_DOUBLE_BUFFERING=y
# Refuse medium locks so the host keeps polling and unmounts cleanly when
# we report "no media" before rebooting (needs bootloader/zephyr/patches).
CONFIG_USBD_MSC_MEDIUM_LOCK=n

CONFIG_DISK_DRIVERS=y

CONFIG_GPIO=y
CONFIG_PWM=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=n
# Use the full RRAMC write buffer (32 x 128-bit words) instead of
# committing every word individually.
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32

# Zephyr boot-mode retention (shared with ZMK's &bootloader).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_CACHE_MANAGEMENT=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_BT=n

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
