# No reset button on Lily Ultra: enter DFU with ZMK's &bootloader or by
# holding the outermost top key while plugging in. Skip the boot delay.
CONFIG_UF2_DOUBLE_TAP=n

# No UART broken out; logs go over SWD via RTT.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_UF2_BOARD_ID="Lily-Ultra-right-v1"
CONFIG_UF2_PRODUCT_NAME="Lily Ultra (right)"
CONFIG_UF2_USBD_PRODUCT="Lily Ultra UF2 Bootloader"
CONFIG_UF2_USBD_MANUFACTURER="Lily"
CONFIG_UF2_VOLUME_LABEL="LILYULTRA  "
