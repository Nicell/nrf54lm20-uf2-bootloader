name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bootloader
          toolchains: arm-zephyr-eabi

      - name: Build and stage release assets
        run: |
          mkdir -p out
          for b in nrf54lm20dk lily_ultra_left lily_ultra_right; do
            west build -p -b "$b/nrf54lm20a/cpuapp" -d "build/$b" bootloader
            cp "build/$b/zephyr/zephyr.hex" "out/$b-uf2-bootloader-${{ github.ref_name }}.hex"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
