# Test app for the UF2 bootloader: boots from slot0, logs over RTT, then
# asks for the bootloader the same way ZMK's &bootloader does.
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_REBOOT=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
